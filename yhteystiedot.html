<head>

<title>Yhteystiedot – Sähkötekniikka Näkki Oy | Iitti & Kouvola</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #333;
    line-height: 1.6;
  }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    background: #fff;
    padding: 30px 50px;
  }
  /* Banner with logo image */
  .banner {
    background: #fff;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 0;
  }
  .banner img {
    max-width: 100%;
    height: auto;
    display: block;
  }
  /* Nav */
  nav {
    background: #1f5fbf;
    margin-top: 25px;
  }
  nav ul {
    list-style: none;
    display: flex;
    justify-content: space-around;
  }
  nav ul li {
    flex: 1;
    text-align: center;
  }
  nav ul li a {
    display: block;
    padding: 16px 10px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  nav ul li a:hover,
  nav ul li a.active {
    background: #174a96;
  }
  /* Content */
  .main {
    margin-top: 30px;
  }
  .main h2 {
    color: #0e1f4d;
    margin-bottom: 20px;
    font-size: 22px;
  }
  .contact-block {
    background: #f8f8f8;
    padding: 25px 30px;
    border-radius: 8px;
    border-left: 4px solid #1f5fbf;
    max-width: 500px;
  }
  .contact-row {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #e5e5e5;
    font-size: 16px;
  }
  .contact-row:last-child {
    border-bottom: none;
  }
  .contact-icon {
    font-size: 22px;
    color: #1f5fbf;
    margin-right: 15px;
    width: 30px;
    text-align: center;
  }
  .contact-row a {
    color: #0e1f4d;
    text-decoration: none;
    font-weight: 600;
  }
  .contact-row a:hover {
    text-decoration: underline;
  }
  /* Kopioi-nappi */
  .contact-row .contact-value {
    flex: 1;
  }
  .copy-btn {
    background: #1f5fbf;
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: background 0.2s, transform 0.1s;
    margin-left: 10px;
    white-space: nowrap;
  }
  .copy-btn:hover {
    background: #174a96;
  }
  .copy-btn:active {
    transform: scale(0.96);
  }
  .copy-btn.copied {
    background: #2e8f3f;
  }
  /* Luotettava Kumppani -logo */
  .partner-logo {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 20px;
    max-width: 500px;
  }
  .partner-logo img {
    max-width: 180px;
    height: auto;
    display: block;
  }
  .partner-logo p {
    font-size: 14px;
    color: #555;
    margin: 0;
  }
  /* Footer */
  footer {
    text-align: center;
    color: #fff;
    background: #1f5fbf;
    margin-top: 40px;
    padding: 25px 20px;
    font-size: 14px;
    border-radius: 8px;
    line-height: 1.8;
  }

  /* ===== TUMMA TEEMA ===== */
  body {
    background: #0f1419;
    color: #d4d4d4;
  }
  .container {
    background: #1a1f2e;
  }
  .banner {
    background: #fff;
    border-radius: 10px;
  }
  .main h2 {
    color: #6ba3ff;
  }
  .contact-block {
    background: #242a3a;
    border-left-color: #6ba3ff;
  }
  .contact-row {
    color: #d4d4d4;
    border-bottom-color: #2d3548;
  }
  .contact-row .contact-value,
  .contact-row a[href^="tel:"],
  .contact-row a[href^="mailto:"] {
    color: #d4d4d4 !important;
    text-decoration: none !important;
  }
  .contact-icon {
    color: #6ba3ff;
  }
  .partner-logo {
    background: #fff;
    padding: 15px 20px;
    border-radius: 8px;
    display: inline-flex;
    max-width: none;
  }

  /* ===== Tabletti ===== */
  @media (max-width: 768px) {
    .container {
      margin: 0;
      padding: 15px;
    }
    .banner {
      padding: 10px;
    }
    nav ul li a {
      padding: 14px 6px;
      font-size: 12px;
      letter-spacing: 1px;
    }
  }

  /* ===== Mobiili ===== */
  @media (max-width: 480px) {
    body {
      font-size: 15px;
    }
    .container {
      padding: 10px;
    }
    .banner {
      padding: 5px;
    }
    nav {
      margin-top: 15px;
    }
    nav ul {
      flex-direction: column;
    }
    nav ul li {
      border-bottom: 1px solid #174a96;
    }
    nav ul li:last-child {
      border-bottom: none;
    }
    nav ul li a {
      padding: 14px 10px;
      font-size: 14px;
      letter-spacing: 2px;
    }
    .main h2 {
      font-size: 19px;
    }
    .contact-block {
      padding: 18px 15px;
    }
    .contact-row {
      font-size: 14px;
      flex-wrap: wrap;
    }
    .contact-row .contact-value {
      word-break: break-word;
      min-width: 0;
    }
    .copy-btn {
      padding: 5px 10px;
      font-size: 12px;
      margin-left: 8px;
    }
    .contact-icon {
      font-size: 18px;
      width: 24px;
      margin-right: 10px;
    }
    .partner-logo {
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 15px;
      justify-content: center;
      max-width: 100%;
    }
    .partner-logo img {
      max-width: 130px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <!-- Logo as banner -->
    <div class="banner">
      <img src="logo.png" alt="Sähkötekniikka Näkki Oy">
    </div>

    <!-- Navigation -->
    <nav>
      <ul>
        <li><a href="index.html">ETUSIVU</a></li>
        <li><a href="palvelut.html">PALVELUT</a></li>
        <li><a href="yritys.html">YRITYS</a></li>
        <li><a href="yhteystiedot.html" class="active">YHTEYSTIEDOT</a></li>
      </ul>
    </nav>

    <!-- Content -->
    <div class="main">
      <h2>Yhteystiedot</h2>

      <div class="contact-block">
        <div class="contact-row">
          <span class="contact-icon">👤</span>
          <span class="contact-value">Joonas Näkki</span>
        </div>
        <div class="contact-row">
          <span class="contact-icon">📞</span>
          <span class="contact-value">044 771 1155</span>
          <button class="copy-btn" data-copy="044 771 1155">Kopioi</button>
        </div>
        <div class="contact-row">
          <span class="contact-icon">✉</span>
          <span class="contact-value">sahkotekniikkanakki@gmail.com</span>
          <button class="copy-btn" data-copy="sahkotekniikkanakki@gmail.com">Kopioi</button>
        </div>
      </div>

      <script>
        document.querySelectorAll('.copy-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var text = btn.getAttribute('data-copy');
            navigator.clipboard.writeText(text).then(function() {
              var original = btn.textContent;
              btn.textContent = 'Kopioitu!';
              btn.classList.add('copied');
              setTimeout(function() {
                btn.textContent = original;
                btn.classList.remove('copied');
              }, 1500);
            }).catch(function() {
              // Fallback vanhoille selaimille
              var t = document.createElement('textarea');
              t.value = text;
              document.body.appendChild(t);
              t.select();
              document.execCommand('copy');
              document.body.removeChild(t);
              var original = btn.textContent;
              btn.textContent = 'Kopioitu!';
              btn.classList.add('copied');
              setTimeout(function() {
                btn.textContent = original;
                btn.classList.remove('copied');
              }, 1500);
            });
          });
        });
      </script>

      <div class="partner-logo">
        <img src="luotettava-kumppani.png" alt="Luotettava Kumppani">
        <img src="luotettava-kumppani-musta.png" alt="Luotettava Kumppani">
      </div>
    </div>

    <footer>
      © Sähkötekniikka Näkki Oy<br>
      Y-tunnus: 3512249-7<br>
      2026
    </footer>
  </div>
</body>
</html>
